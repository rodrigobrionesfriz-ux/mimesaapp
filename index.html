<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mi Mesa</title>
    <meta name="description" content="Planificacion de desayuno, colacion, almuerzo y cena para la familia, con registro de lo sugerido frente a lo realmente preparado." />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./iconos/icono-192.png" />
    <link rel="apple-touch-icon" href="./iconos/icono-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mi Mesa" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#354A5F" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12171C" media="(prefers-color-scheme: dark)" />

    <script>
      // Aplica el tema antes de pintar para evitar el destello blanco al abrir en modo oscuro.
      (function () {
        var g = localStorage.getItem('mimesa:tema');
        var oscuro = g ? g === 'oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
